name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Windows because the project is: it drives a Windows-only AMI utility and
    # two kernel drivers, and the live path needs administrator rights.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run the tests
        # No firmware on a runner and no administrator rights, which is fine:
        # the suite reads a committed synthetic export from tests/fixtures
        # instead of a board. Nothing here executes SCEWIN.
        run: cargo test --locked

      - name: Build the release executable
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v7
        with:
          # Unsigned, and without scewin/ -- the AMI binaries live beside the
          # executable rather than inside it, so this artifact is a build check
          # rather than something to hand to anyone.
          name: roch-nvram-unsigned-no-scewin
          path: |
            target/release/roch-nvram.exe
            target/release/scewin-parser.exe
            target/release/make-quick-settings.exe
          if-no-files-found: error
